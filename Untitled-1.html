<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Raoul Cartenz Binsar Aruan</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        
        .card {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .foto-profil {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3498db;
            margin-bottom: 15px;
        }
        
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        h2 {
            font-size: 16px;
            color: #7f8c8d;
            font-weight: normal;
            margin-bottom: 20px;
        }
        
        .info-akademik {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        
        .badge {
            background-color: #eef2f5;
            color: #555;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #ddd;
        }
        
        /* Media Sosial */
        .social-media {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        .social-media a {
            text-decoration: none;
            color: white;
            background-color: #3498db;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .social-media a:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://i.ibb.co.com/TDr7Zvrv/Whats-App-Image-2026-09-24-at-12-57-06.jpg" 
             alt="Foto Profil Raoul Cartenz Binsar Aruan" 
             class="foto-profil">
        
        <h1>Raoul Cartenz Binsar Aruan</h1>
        
        <h2>Universitas Telkom</h2>
        
        <div class="info-akademik">
            <span class="badge"> NIM: 102042500144</span>
            <span class="badge"> Fakultas Rekayasa Industri</span>
            <span class="badge"> Sistem Informasi</span>
        </div>
        
        <!-- MEDIA SOSIAL -->
        <div class="social-media">
            <a href="https://www.instagram.com/raoularuan/" target="_blank">Instagram</a>
            <a href="https://www.linkedin.com/in/raoul-cartenz-binsar-aruan/?isSelfProfile=true" target="_blank">LinkedIn</a>
            <a href="https://github.com/raoularuan-gif" target="_blank">GitHub</a>
            <a href="mailto:ferdinanluis36@gmail.com">Email</a>
        </div>
        
    </div>

</body>
</html>
